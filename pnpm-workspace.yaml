packages:
  - "."
  - "apps/*"
  - "packages/*"
  - "design-system"
  - "mobile/*"

overrides:
  postcss: 8.5.14
  uuid: 11.1.1
  protobufjs: 7.6.1

onlyBuiltDependencies:
  - "@firebase/util"
  - "@sentry/cli"
  - "core-js"
  - "esbuild"
  - "msgpackr-extract"
  - "protobufjs"
  - "sharp"
  - "unrs-resolver"
allowBuilds:
  "@firebase/util": true
  "@sentry/cli": true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
